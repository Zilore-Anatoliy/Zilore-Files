    <rect x="20" y="122" width="402" height="70" rx="10" fill="#060A14" stroke="#1E293B"/><text x="32" y="144" fill="#E2E8F0" class="mono" font-size="13" font-weight="700">UsbOtgDriver &amp; UsbOtgMonitor (User-Space No-Root)</text><text x="32" y="163" fill="#6EE7B7" class="mono" font-size="11.5">Прямой доступ через UsbDeviceConnection в обход лимитов FUSE</text><text x="32" y="180" fill="#94A3B8" class="mono" font-size="10.5">Горячее подключение внешних SSD / HDD / NVMe боксов на ТВ и смартфонах</text>
