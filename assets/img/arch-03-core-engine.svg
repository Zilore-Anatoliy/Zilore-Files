<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-label="Архитектура ядра :core:fs-engine">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="960" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050814"/><stop offset="50%" stop-color="#0C1228"/><stop offset="100%" stop-color="#04060D"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      @keyframes scsiFlow { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
      .scsi-bus { stroke-dasharray: 9 9; animation: scsiFlow 1s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .scsi-bus { animation: none !important; } }
