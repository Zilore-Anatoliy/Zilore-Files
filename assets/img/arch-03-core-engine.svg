    <rect x="226" y="42" width="196" height="70" rx="10" fill="#060A14" stroke="#1E293B"/><text x="238" y="64" fill="#FFFFFF" class="mono" font-size="13" font-weight="700">ArchiveManager</text><text x="238" y="83" fill="#67E8F9" class="mono" font-size="11.5">zip4j • junrar • 7z • TAR</text><text x="238" y="100" fill="#94A3B8" class="mono" font-size="10.5">In-Place чтение + Zip-Slip</text>
