    <text x="46" y="44" fill="#A5B4FC" class="mono" font-size="12">Пакет: com.zilore.core.fs.* • User-Space USB Bulk SCSI (No-Root) • 5 Clouds &amp; WebStudio Assets • AES-256</text>
  </g>
