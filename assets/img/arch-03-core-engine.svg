    <rect x="226" y="122" width="196" height="72" rx="10" fill="#060A14" stroke="#1E293B"/><text x="238" y="144" fill="#A5B4FC" class="mono" font-size="13" font-weight="700">BinaryHeaderInspector</text><text x="238" y="163" fill="#C7D2FE" class="mono" font-size="11.5">ELF / DEX / Magic Bytes</text><text x="238" y="180" fill="#94A3B8" class="mono" font-size="10.5">+ LocalShellSession</text>
